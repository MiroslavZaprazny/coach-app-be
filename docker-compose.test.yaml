services:
  app:
    container_name: app
    build:
      context: ./app
      target: test
    ports:
      - "4000:4000"
    volumes:
      - ./app:/app
    environment:
      - DB_NAME=app
      - DB_USER=dev
      - DB_PASSWORD=supersecret
      - COOKIE_SIGN_SALT=testerino
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - API_USER=dev
      - API_PASSWORD=dev
    depends_on:
      - db
    command: >
      sh -c "
        mix ecto.migrate && mix test
      "

  db:
    container_name: db
    image: postgres:17.6
    restart: unless-stopped
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=supersecret
